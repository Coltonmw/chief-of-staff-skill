name: Claude Review

# Claude's review step (vault Workflow section 11, step 3; Brief
# review-handoffs-1101, pick 3 B). Once pass 1 passes, Firstmate posts a PR
# comment that starts with "@claude review", and Claude answers on the PR as
# claude[bot]. Advisory: it never approves, requests changes or merges.
#
# Copied from syda-syao/annapurna .github/workflows/claude.yml, narrowed:
# - only PR comments that START with "@claude" (Annapurna's matches "@claude"
#   anywhere, on four event types, so every comment starts a run that is then
#   skipped);
# - only from the owner or a collaborator (Firstmate posts as Coltonmw).
# Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret (Colton adds it) and the
# Claude GitHub App on this repo. issue_comment workflows run from the
# default branch, so this works only after it is merged to main.

on:
  issue_comment:
    types: [created]

jobs:
  claude:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
